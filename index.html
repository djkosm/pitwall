<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pit Wall Live</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1320;--card:#171e2f;--ink:#eef1f7;--mut:#8d97ad;--line:#27304a;--red:#ff2d20;--yel:#ffd21f;--grn:#2ecc71;--blu:#4aa8ff;--road:#2c3550;color-scheme:dark;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f0f1f5;--card:#fff;--ink:#141824;--mut:#5f6677;--line:#dadde6;--road:#c7ccda;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 12px 90px}
h1,h2,h3,.big{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;margin:0}h3{font-size:18px;margin-bottom:8px}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
select,input,button{font:inherit;border-radius:10px;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 10px}
button{background:var(--red);color:#fff;border:0;font-weight:600;cursor:pointer}button.g{background:none;color:var(--mut)}
select{width:100%}input{width:100%;margin-bottom:8px}
.ban{border-radius:16px;padding:14px;margin-bottom:12px;color:#111;display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center}
.ban h2{font-size:30px;line-height:1}.ban .t{font:700 34px "Barlow Condensed";font-variant-numeric:tabular-nums}
.ban svg{width:130px}.ban path{fill:none;stroke:#0008;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.ban path.l{stroke:#fff;stroke-width:2.5}
.g-GREEN{background:var(--grn)}.g-RED{background:var(--red);color:#fff}.g-SC,.g-VSC,.g-SCIN{background:var(--yel)}.g-END{background:#fff}.g-NONE{background:var(--card);color:var(--ink)}
.r{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.r b{width:26px;text-align:right}
.bar{width:5px;height:26px;border-radius:3px}.tyre{width:22px;height:22px;border-radius:50%;border:3px solid var(--c);font:700 11px/16px sans-serif;text-align:center}
.r .gap{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;min-height:56px;font-size:13px;border:0}nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--red)}
.ev{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<main>
<div style="display:flex;gap:8px;margin-bottom:10px"><select id="ses" aria-label="Session"></select><button class="g" id="cfg" aria-label="Sign in">🔑</button></div>
<div id="login" class="card" hidden>
<h3>Sign in to OpenF1 (optional)</h3>
<p class="mut" style="margin-bottom:8px">Past sessions work free without signing in. Live sessions need a paid OpenF1 account. Your login stays in this tab’s memory only and is sent only to api.openf1.org.</p>
<input id="u" type="email" placeholder="OpenF1 email" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">
<button id="go" style="width:100%">Sign in</button><p class="mut" id="lm" style="margin-top:6px"></p></div>
<div id="app"></div>
</main>
<nav><button data-t="l" class="on">🏁 Live</button><button data-t="r">🏆 Results</button><button data-t="s">📊 Standings</button></nav>

function status(){const o={k:"NONE",since:null,total:0,ns:null,lap:null},neu=k=>k==="RED"||k==="SC"||k==="VSC"||k==="SCIN";
 [...S.rc].sort((a,b)=>a.date<b.date?-1:1).forEach(m=>{const t=Date.parse(m.date),g=(m.message||"").toUpperCase(),f=m.flag,tr=m.scope==="Track";let n=null;
  if(f==="RED"&&tr)n="RED";else if(g.includes("VIRTUAL SAFETY CAR DEPLOYED"))n="VSC";else if(g.includes("SAFETY CAR DEPLOYED")&&!g.includes("VIRTUAL"))n="SC";
  else if(g.includes("SAFETY CAR IN THIS LAP")||g.includes("VIRTUAL SAFETY CAR ENDING"))n="SCIN";else if(f==="CHEQUERED")n="END";else if((f==="GREEN"||f==="CLEAR")&&tr)n="GREEN";
  if(!n||n===o.k)return;if(neu(n)&&!neu(o.k))o.ns=t;if(!neu(n)&&neu(o.k)&&o.ns!=null){o.total+=t-o.ns;o.ns=null}o.k=n;o.since=t;o.lap=m.lap_number});
 return o}
const LBL={GREEN:"Green flag",RED:"Red flag",SC:"Safety car",VSC:"Virtual safety car",SCIN:"Safety car in this lap",END:"Session finished",NONE:"Waiting for session"};
const mmss=ms=>{ms=Math.max(0,Math.floor(ms/1e3));return Math.floor(ms/60)+":"+String(ms%60).padStart(2,"0")};
function outline(){const s=S.cur,t=nrm([s.location,s.country_name,s.circuit_short_name].join(" "));const i=PL.findIndex(p=>new RegExp(p).test(t));return i>=0&&TK[i]?TK[i]:null}
const FL={GREEN:"🟩",YELLOW:"🟨","DOUBLE YELLOW":"🟨🟨",RED:"🟥",BLUE:"🟦",CHEQUERED:"🏁",CLEAR:"✅","BLACK AND WHITE":"⬛"},TY={SOFT:["S","#ff4d42"],MEDIUM:["M","#ffd21f"],HARD:["H","#eee"],INTERMEDIATE:["I","#2ecc71"],WET:["W","#4aa8ff"]};
const hm=d=>new Date(d).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const nm=n=>(S.drv[n]||{}).name_acronym||"#"+n;
function viewLive(){const o=status(),now=live()?Date.now():(S.rc.length?Date.parse(S.rc[S.rc.length-1].date):Date.now()),neu=o.ns!=null,cur=neu?now-o.ns:null,o2=outline();
 let h=`<div class="ban g-${o.k}"><div><p style="font-weight:600">${S.cur.location} · ${S.cur.session_name}${live()?" · LIVE":" · Replay"}</p><h2>${LBL[o.k]}</h2><p>${neu?"Stopped for <b class=t id=cd>"+mmss(cur)+"</b>":o.since?"since "+hm(o.since)+(o.lap?" · lap "+o.lap:""):""}</p>${o.total+(neu?cur:0)>0?`<p style="margin-top:4px">Time lost to neutralisations: <b>${mmss(o.total+(neu?cur:0))}</b></p>`:""}</div>${o2?`<svg viewBox="0 0 200 140"><path d="${o2}"/><path class="l" d="${o2}"/></svg>`:""}</div>`;
 if(S.err)h+=`<div class="card mut">${live()?"Live data needs a paid OpenF1 sign-in (tap 🔑). ":""}Some data didn’t load: ${S.err}</div>`;
 const ds=Object.keys(S.pos).sort((a,b)=>S.pos[a]-S.pos[b]);
 h+=`<div class="card"><h3>Leaderboard</h3>${ds.length?ds.map(n=>{const d=S.drv[n]||{},s=S.st[n],i=S.iv[n],t=s&&TY[s.compound];return `<div class="r"><b>${S.pos[n]}</b><span class="bar" style="background:#${d.team_colour||"888"}"></span><span style="font-weight:600">${d.name_acronym||n}</span>${t?`<span class="tyre" style="--c:${t[1]}">${t[0]}</span>`:""}${s&&s.stint_number>1?`<span class="mut">${s.stint_number-1} stop${s.stint_number>2?"s":""}</span>`:""}<span class="gap">${i?(i.interval==null?"Leader":typeof i.interval==="number"?"+"+i.interval.toFixed(3):i.interval):""}${i&&i.gap_to_leader?`<br><span class="mut">${typeof i.gap_to_leader==="number"?"+"+i.gap_to_leader.toFixed(1):i.gap_to_leader}</span>`:""}</span></div>`}).join(""):'<p class="mut">No positions yet for this session.</p>'}</div>`;
 const w=S.wx;if(w)h+=`<div class="card"><h3>Weather</h3><p>Air ${w.air_temperature}°C · Track ${w.track_temperature}°C · Humidity ${w.humidity}% · Wind ${w.wind_speed} m/s ${w.rainfall?"· 🌧 Rain":""}</p></div>`;
 const pt=[...S.pit].sort((a,b)=>a.date<b.date?1:-1).slice(0,8);if(pt.length)h+=`<div class="card"><h3>Pit stops</h3>${pt.map(p=>`<div class="ev"><b>${nm(p.driver_number)}</b> lap ${p.lap_number} · ${p.stop_duration?p.stop_duration+"s stationary":(p.lane_duration||p.pit_duration||"?")+"s in lane"}</div>`).join("")}</div>`;
 const ot=[...S.ot].sort((a,b)=>a.date<b.date?1:-1).slice(0,8);if(ot.length)h+=`<div class="card"><h3>Overtakes</h3>${ot.map(p=>`<div class="ev">${hm(p.date)} · <b>${nm(p.overtaking_driver_number)}</b> passed ${nm(p.overtaken_driver_number)} for P${p.position}</div>`).join("")}</div>`;
 const rc=[...S.rc].sort((a,b)=>a.date<b.date?1:-1).slice(0,40);h+=`<div class="card"><h3>Race control</h3>${rc.length?rc.map(m=>`<div class="ev">${m.category==="SafetyCar"?"🚨":FL[m.flag]||"ℹ️"} <span class="mut">${hm(m.date)}${m.lap_number?" · L"+m.lap_number:""}</span><br>${m.message||""}</div>`).join(""):'<p class="mut">No messages yet.</p>'}</div>`;
 return h}
async function viewResults(){const rows=await J("session_result","session_key="+S.cur.session_key);
 const f=v=>Array.isArray(v)?f(v.filter(x=>x!=null).slice(-1)[0]):typeof v==="number"?(v>=60?Math.floor(v/60)+":"+(v%60).toFixed(3).padStart(6,"0"):v.toFixed(3)):v==null?"":v;
 return `<div class="card"><h3>${S.cur.location} · ${S.cur.session_name}</h3>${rows.length?rows.sort((a,b)=>a.position-b.position).map(r=>{const d=S.drv[r.driver_number]||{};return `<div class="r"><b>${r.dnf?"DNF":r.dns?"DNS":r.dsq?"DSQ":r.position}</b><span class="bar" style="background:#${d.team_colour||"888"}"></span><span style="font-weight:600">${d.full_name||r.driver_number}</span><span class="gap">${r.position===1?f(r.duration):r.gap_to_leader?("+"+f(r.gap_to_leader)).replace("++","+"):""}</span></div>`}).join(""):'<p class="mut">Results appear a few minutes after a session ends.</p>'}</div>`}
async function viewStand(){const races=SES.filter(s=>s.session_name==="Race"&&Date.parse(s.date_end)<Date.now());const r=races[races.length-1];if(!r)return'<div class="card mut">No finished races found yet.</div>';
 const q="session_key="+r.session_key,[d,t,dr]=await Promise.all([J("championship_drivers",q),J("championship_teams",q),J("drivers",q)]),m={};dr.forEach(x=>m[x.driver_number]=x);
 return `<div class="card"><h3>Drivers · after ${r.location}</h3>${d.sort((a,b)=>a.position_current-b.position_current).map(x=>{const p=m[x.driver_number]||{};return `<div class="r"><b>${x.position_current}</b><span class="bar" style="background:#${p.team_colour||"888"}"></span><span style="font-weight:600">${p.full_name||x.driver_number}</span><span class="gap">${x.points_current}</span></div>`}).join("")||'<p class="mut">Not available.</p>'}</div><div class="card"><h3>Teams</h3>${t.sort((a,b)=>a.position_current-b.position_current).map(x=>`<div class="r"><b>${x.position_current}</b><span style="font-weight:600">${x.team_name}</span><span class="gap">${x.points_current}</span></div>`).join("")||'<p class="mut">Not available.</p>'}</div>`}
async function render(){if(!S.cur)return;const h=tab==="l"?viewLive():tab==="r"?await viewResults():await viewStand();$("app").innerHTML=h}
setInterval(()=>{const e=$("cd");if(!e||!live())return;const o=status();if(o.ns!=null)e.textContent=mmss(Date.now()-o.ns)},1000);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render()});
$("ses").onchange=e=>{S.cur=SES.find(s=>String(s.session_key)===e.target.value);start()};
$("cfg").onclick=()=>$("login").hidden=!$("login").hidden;
$("go").onclick=async()=>{$("lm").textContent="Signing in…";try{await login($("u").value,$("p").value);CRED=[$("u").value,$("p").value];$("p").value="";$("lm").textContent="Signed in.";start()}catch(e){$("lm").textContent=e.message}};
init();
</script>
</body>
